<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity AI Chat</title>
    
    <style>
        /* CSS styles from previous steps... */
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e; 
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        #chatBox {
            width: 90%;
            max-width: 600px;
            height: 100%;
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        
        .message-container {
            width: 100%;
            display: flex;
            margin: 5px 0;
            justify-content: flex-start;
        }
        .user-message {
            justify-content: flex-end; 
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 75%;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            font-size: 16px;
        }

        .user-message .bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 5px; 
        }

        .bot-message .bubble {
            background: #2e2e2e;
            color: white;
            border-bottom-left-radius: 5px; 
        }

        .input-area {
            display: flex;
            width: 90%;
            max-width: 600px;
            padding: 10px 0;
            margin-top: 10px;
            align-items: center; 
        }
        
        #userMessage {
            flex-grow: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            resize: none;
            margin-right: 10px;
            font-size: 16px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Entity AI Chat</h1>
    <div id="chatBox">
        <div class="message-container bot-message">
            <div class="bubble">Hello! I'm your AI assistant. Ask me anything.</div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="userMessage" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
    
    <div class="footer">
        &copy; 2025 Damar Aman
    </div>

    <script src="script.js"></script>
</body>
</html>
